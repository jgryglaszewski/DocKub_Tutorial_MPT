services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: helloworld
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d helloworld"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/helloworld
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - default

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - default

volumes:
  postgres-data:

networks:
  db-network:
    internal: true
  default: {}