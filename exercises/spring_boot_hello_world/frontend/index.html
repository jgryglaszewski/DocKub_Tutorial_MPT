<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
</head>

<body>
  <h1>HWApp</h1>

  <form id="form">
    <input id="name" type="text" placeholder="Type your name" required>
    <button type="submit">Submit</button>
  </form>

  <p id="message"></p>
  <h2>Known names</h2>
  <ul id="list"></ul>

  <label>
    <input id="show-count" type="checkbox">
    Show count
  </label>

  <div id="count-section" hidden>
    <h2>Name counts</h2>
    <ul id="count-list"></ul>
  </div>

  

  <script src="app.js"></script>
</body>

</html>
